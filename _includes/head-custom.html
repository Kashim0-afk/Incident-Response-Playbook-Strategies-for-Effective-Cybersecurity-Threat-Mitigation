<!--
  Mermaid on GitHub Pages.
  GitHub renders ```mermaid blocks natively in the repository view, but Jekyll/kramdown
  turns them into ordinary code blocks. This script finds those blocks, swaps them for
  <div class="mermaid"> and lets mermaid.js draw them.
-->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const blocks = document.querySelectorAll(
    "div.language-mermaid, pre > code.language-mermaid"
  );
  blocks.forEach((block) => {
    const code = block.querySelector("code") || block;
    const container = block.matches("div.language-mermaid") ? block : block.parentElement;
    const diagram = document.createElement("div");
    diagram.className = "mermaid";
    diagram.textContent = code.textContent;
    container.replaceWith(diagram);
  });

  mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
